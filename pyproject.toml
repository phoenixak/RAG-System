[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-system"
version = "2.0.0"
description = "Grounded document Q&A: hybrid retrieval (dense + BM25), cross-encoder reranking and cited answers from a local LLM"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ahmed Khaled Ali", email = "phoniex199940@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.3",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# local GGUF model on CPU (prebuilt wheel on Windows/macOS; compiles on Linux, see Dockerfile)
llm = ["llama-cpp-python>=0.3"]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "slowapi>=0.1.9",
    "chromadb>=1.0",
]
demo = ["gradio>=5.9"]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "B905"]  # Depends() in defaults; zip() lengths match by construction

[tool.ruff.lint.per-file-ignores]
"space/app.py" = ["E501"]  # inline HTML
