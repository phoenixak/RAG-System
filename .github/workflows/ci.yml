name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch, no LLM; tests use small fakes)
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[api,dev]"
      - name: Lint
        run: uv run ruff check src tests eval space && uv run ruff format --check src tests eval space
      - name: Test
        run: uv run pytest -q
