services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - models:/models   # Hugging Face cache: embedder, reranker and the GGUF survive rebuilds
      - index:/data      # ChromaDB index of uploaded documents
    restart: unless-stopped

volumes:
  models:
  index:
